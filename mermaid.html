<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wizard App Flow Visualizer</title>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      window.mermaid = mermaid;
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #111827);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px;
      }

      .card {
        width: min(1200px, 100%);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }

      p {
        margin: 0 0 16px;
        color: #cbd5e1;
        line-height: 1.5;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        margin-bottom: 12px;
        background: #38bdf8;
        color: #082f49;
        font-weight: 700;
        cursor: pointer;
      }

      #flow-diagram {
        overflow-x: auto;
        padding-top: 8px;
      }

      .status {
        color: #fca5a5;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Wizard App Flow Visualizer</h1>
      <p>This view turns the Wizard workflow into an interactive Mermaid sequence diagram you can inspect and reuse.</p>
      <button id="theme-toggle" type="button">Switch to light theme</button>
      <div id="flow-diagram"></div>
    </main>
    <script src="./mermaid.js"></script>
  </body>
</html>
